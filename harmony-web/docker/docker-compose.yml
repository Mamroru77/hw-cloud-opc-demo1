version: '3.8'

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - opc-network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - CLOUDVEIN_DB_PATH=/app/data/cloudvein.db
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - PANGU_API_KEY=${PANGU_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CODEARTS_PIPELINE_API_URL=${CODEARTS_PIPELINE_API_URL:-}
      - CODEARTS_INSIGHT_API_URL=${CODEARTS_INSIGHT_API_URL:-}
      - CODEARTS_PROJECT_ID=${CODEARTS_PROJECT_ID:-}
      - CODEARTS_AUTH_TOKEN=${CODEARTS_AUTH_TOKEN:-}
      - CODEARTS_WEBHOOK_SECRET=${CODEARTS_WEBHOOK_SECRET:-}
    volumes:
      - cloudvein-sqlite:/app/data
      - cloudvein-chroma:/app/chroma_data
    restart: unless-stopped
    networks:
      - opc-network

volumes:
  cloudvein-sqlite:
  cloudvein-chroma:

networks:
  opc-network:
    driver: bridge
